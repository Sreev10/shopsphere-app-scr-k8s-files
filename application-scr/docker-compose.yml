services:
  
  postgres:
    image: postgres:16
    environment:
     POSTGRES_DB: shopsphere
     POSTGRES_USER: shopsphere
     POSTGRES_PASSWORD: shopshere
    ports: 
     - "5432:5432"
    volumes:
     - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopshere -d shopsphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  product-service:
    image: shopsphere/product-service:1.0
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopsphere-network

  user-service:
    image: shopsphere/user-service:1.0
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopsphere-network

  order-service:
    image: shopsphere/order-service:1.0
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopsphere-network

  payment-service:
    image: shopsphere/payment-service:1.0
    ports:
      - "8084:8084"
    networks:
      - shopsphere-network

  frontend:
    image: shopsphere/frontend:1.0
    ports:
      - "3000:80"
    depends_on:
      - product-service
      - user-service
      - order-service
      - payment-service
    networks:
      - shopsphere-network

networks:
  shopsphere-network:
    driver: bridge

volumes:
  postgres-data:



  

